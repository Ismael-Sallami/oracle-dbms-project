# Two jobs. The first compiles the application; the second starts a real Oracle,
# creates the schema and compiles every trigger, because parsing SQL only proves
# the text is well formed, not that the database accepts it.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byte-compile the application
        run: bash tools/check-python.sh

  oracle:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: test
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the driver
        run: pip install oracledb

      - name: Create the schema and compile every trigger
        env:
          ORACLE_DSN: localhost:1521/FREEPDB1
          ORACLE_USER: system
          ORACLE_PASSWORD: test
        run: python3 tools/run-against-oracle.py
